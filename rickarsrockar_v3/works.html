<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works — RickarsRockar</title>
  <meta name="description" content="RickarsRockar の全作品一覧">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">RICKARS<span class="ac">R</span>OCKAR</a>
      <nav>
        <a href="index.html">Gallery</a>
        <a href="works.html" class="active">Works</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-main">

    <div class="page-header">
      <div class="page-header-inner">
        <span class="page-eyebrow">Works</span>
        <h1 class="page-title">ALL WORKS</h1>
      </div>
    </div>

    <!-- タグフィルター -->
    <div class="works-filter-bar">
      <div class="works-filter-inner">
        <span class="filter-label">Filter</span>
        <div class="filter-tags" id="filter-tags">
          <!-- JS で生成 -->
        </div>
      </div>
    </div>

    <div class="works-wrap">
      <div class="works-grid" id="works-grid">
        <!-- JS で生成 -->
      </div>
      <div class="pgn" id="pgn"></div>
    </div>

  </main>

  <footer>
    <span class="fl">RICKARS<span class="ac">R</span>OCKAR</span>
    <p>© 2025 RickarsRockar — All illustrations reserved</p>
  </footer>

  <script src="js/posts.js"></script>
  <script>
    const PER_PAGE = 9;
    let currentTag  = null;
    let currentPage = 1;

    function getParams() {
      const p = new URLSearchParams(location.search);
      currentTag  = p.get('tag')  || null;
      currentPage = parseInt(p.get('page') || '1');
    }

    function renderFilterTags() {
      const tags = ['All', ...new Set(POSTS.map(p => p.tag))];
      document.getElementById('filter-tags').innerHTML = tags.map(t => {
        const isAll = t === 'All';
        const active = (isAll && !currentTag) || t === currentTag;
        const href = isAll ? 'works.html' : `works.html?tag=${encodeURIComponent(t)}`;
        return `<a href="${href}" class="filter-tag${active ? ' active' : ''}">${t}</a>`;
      }).join('');
    }

    function renderWorks() {
      let posts = currentTag ? POSTS.filter(p => p.tag === currentTag) : POSTS;
      const total = Math.ceil(posts.length / PER_PAGE);
      const sliced = posts.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

      document.getElementById('works-grid').innerHTML = sliced.map(p => `
        <a href="post.html?id=${p.id}" class="card">
          <div class="card-thumb">
            <img src="${p.image}" alt="${p.title}"
              onerror="this.style.display='none'; this.parentNode.classList.add('no-img-placeholder')">
            <span class="ctag">${p.tag}</span>
          </div>
          <div class="card-body">
            <h3>${p.title}</h3>
            <span class="dt">${p.date}</span>
            <p class="ex">${p.excerpt}</p>
          </div>
        </a>`).join('');

      // ページネーション
      if (total <= 1) {
        document.getElementById('pgn').innerHTML = '';
        return;
      }
      const tagQ = currentTag ? `&tag=${encodeURIComponent(currentTag)}` : '';
      let pg = '';
      for (let i = 1; i <= total; i++) {
        pg += `<a href="works.html?page=${i}${tagQ}" class="pg${i === currentPage ? ' active' : ''}">${i}</a>`;
      }
      if (currentPage < total) {
        pg += `<a href="works.html?page=${currentPage + 1}${tagQ}" class="pg">›</a>`;
      }
      document.getElementById('pgn').innerHTML = pg;
    }

    getParams();
    renderFilterTags();
    renderWorks();
  </script>

</body>
</html>
