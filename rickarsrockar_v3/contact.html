<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — RickarsRockar</title>
  <meta name="description" content="RickarsRockar への連絡先">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">RICKARS<span class="ac">R</span>OCKAR</a>
      <nav>
        <a href="index.html">Gallery</a>
        <a href="works.html">Works</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-main">

    <div class="page-header">
      <div class="page-header-inner">
        <span class="page-eyebrow">Contact</span>
        <h1 class="page-title">GET IN TOUCH</h1>
      </div>
    </div>

    <div class="page-wrap">

      <section class="page-section">
        <h2 class="sec-label">Contact</h2>

        <!-- =====================================================
             ★ 連絡先を追加・編集する場合は下の .contact-item を
               コピーして内容を書き換えてください。
             ===================================================== -->
        <div class="contact-list">

          <div class="contact-item">
            <span class="contact-label">X (Twitter)</span>
            <div class="contact-body">
              <span class="contact-handle">@namakemono_rc</span>
              <a href="https://x.com/namakemono_rc" target="_blank" rel="noopener" class="link-btn">
                Open →
              </a>
            </div>
          </div>

          <div class="contact-item">
            <span class="contact-label">Pixiv</span>
            <div class="contact-body">
              <span class="contact-handle">pixiv.net/users/427076</span>
              <a href="https://www.pixiv.net/users/427076" target="_blank" rel="noopener" class="link-btn">
                Open →
              </a>
            </div>
          </div>

          <!-- ↓ メールアドレスを追加する場合（コメント解除して使う）
          <div class="contact-item">
            <span class="contact-label">Mail</span>
            <div class="contact-body">
              <span class="contact-handle">your@email.com</span>
              <a href="mailto:your@email.com" class="link-btn">Mail →</a>
            </div>
          </div>
          ↑ -->

        </div>
      </section>

      <section class="page-section">
        <h2 class="sec-label">Note</h2>
        <div class="contact-note">
          <!-- ★ お問い合わせに関する注意書きをここに書いてください ★ -->
          <p>お問い合わせは X の DM にてお気軽にどうぞ。</p>
          <p>（ここにその他の注意事項があれば追加してください）</p>
        </div>
      </section>

    </div>
  </main>

  <footer>
    <span class="fl">RICKARS<span class="ac">R</span>OCKAR</span>
    <p>© 2025 RickarsRockar — All illustrations reserved</p>
  </footer>

</body>
</html>
